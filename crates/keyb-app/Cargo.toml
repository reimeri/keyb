[package]
name = "keyb-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "keyb"
path = "src/main.rs"

[dependencies]
keyb-core = { path = "../keyb-core" }
keyb-lm-ppm = { path = "../keyb-lm-ppm" }
keyb-ui = { path = "../keyb-ui" }
anyhow = "1"
keyb-lm-llama = { path = "../keyb-lm-llama" }
keyb-inject = { path = "../keyb-inject" }
crossbeam-channel = "0.5"
fs2 = "0.4"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3"
